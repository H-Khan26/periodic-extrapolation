name = "base"
seed = 0
out_dir = "runs"

[data]
target = "sin"
n_samples = 4096
sampling = "stratified"
noise_rel = 0.0
val_edge_frac = 0.1

[spectral]
k_scan = 16
k_omega_max = 64
oversample = 8
n_candidates = 8
min_cycles = 1.0

[model]
heads = ["linear", "mlp"]
k_max = 64
mlp_harmonics = 4
mlp_width = 64
mlp_depth = 2
mlp_epochs = 3000
mlp_lr = 3e-3
mlp_lbfgs = true
baselines = []

[eval]
points_per_band = 2000
dense_points = 600
